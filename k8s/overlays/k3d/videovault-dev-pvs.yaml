---
# =============================================================================
# VideoVault Static Persistent Volumes for Media Libraries — k3d DEV OVERLAY
# =============================================================================
# These PVs redirect SMB sources from the production NAS (10.0.0.11) to the
# local Windows share (10.10.0.3/storage-desktop) for k3d development clusters.
# DO NOT apply in production — use k8s/services/videovault/pv-media.yaml there.
# =============================================================================

# Movies PV - mounts //10.10.0.3/storage-desktop/movies directly
apiVersion: v1
kind: PersistentVolume
metadata:
  name: videovault-movies-pv
  labels:
    app: videovault
    media-type: movies
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # Empty to prevent dynamic provisioning
  mountOptions:
    - dir_mode=0755
    - file_mode=0644
    - uid=1001
    - gid=1001
    - noperm
    - mfsymlinks
    - cache=none
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: videovault-movies-pv
    volumeAttributes:
      source: "//10.10.0.3/storage-desktop/movies"
    nodeStageSecretRef:
      name: smbcreds
      namespace: korczewski-infra
---
