name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Public repo: nur Repo-Mitglieder duerfen opencode triggern (kein anonymer Trigger).
    if: |
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) && (
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, ' /opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC -> Installation-Token der opencode GitHub App
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        # SHA-gepinnt (Supply-Chain). v1.17.7 (2026-06-14). Bump via Review/Dependabot.
        uses: anomalyco/opencode/github@4ed4f749e644ffb5b279fb30b7b915e743d80142
        with:
          # Freies Zen-Modell big-pickle (kein API-Key gesetzt — Free-Tier).
          model: opencode/big-pickle
